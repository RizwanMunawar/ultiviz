name: Python tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / ${{ matrix.dependencies }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.11', '3.12', '3.13']
        dependencies: [base]
        include:
          - os: ubuntu-latest
            python: '3.12'
            dependencies: ultralytics
          - os: macos-latest
            python: '3.12'
            dependencies: ultralytics
          - os: windows-latest
            python: '3.12'
            dependencies: ultralytics
    env:
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install base package
        run: python -m pip install .
      - name: Check base dependency isolation
        if: matrix.dependencies == 'base'
        run: python -c "import importlib.util; assert importlib.util.find_spec('ultralytics') is None"
      - name: Install optional Ultralytics integration
        if: matrix.dependencies == 'ultralytics'
        run: python -m pip install '.[ultralytics]'
      - name: Check installed dependency consistency
        run: python -m pip check
      - name: Test installed package (no model downloads or GUI)
        run: python -m unittest discover -s tests -v
      - name: Smoke test both CLI entry points
        run: |
          ultiviz --help
          python -m ultiviz --help

  distributions:
    name: Build and check distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Install built wheel
        shell: bash
        run: python -m pip install dist/*.whl
      - name: Test built wheel
        run: python -m unittest discover -s tests -v
      - name: Smoke test installed CLI
        run: ultiviz --help
